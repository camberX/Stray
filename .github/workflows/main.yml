name: Discord

on: push

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Hand the push to Discord's GitHub endpoint so it shows like the native integration:
      # "[Stray:branch] N new commits" with one line per commit.
      - name: Post push to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -fsS -X POST "${WEBHOOK%/}/github" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            --data-binary @"$GITHUB_EVENT_PATH"
