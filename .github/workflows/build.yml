name: build
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: checkout repository
      uses: actions/checkout@v6
    - name: validate gradle wrapper
      uses: gradle/actions/wrapper-validation@v6
    - name: setup jdk
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: build every Minecraft version
      run: |
        chmod +x ./gradlew
        set -o pipefail
        ./gradlew build --continue --stacktrace 2>&1 | tee build.log
    - name: report build errors
      if: failure()
      run: |
        # Surface the compiler and Gradle errors as annotations (readable through the API).
        python3 - <<'PY'
        import re
        lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
        keep = []
        for i, line in enumerate(lines):
            if re.search(r"error:|What went wrong|Exception|FAILED|> ", line):
                keep.extend(lines[i:i + 4])
        keep = [l for n, l in enumerate(keep) if l not in keep[:n]][:400]
        for start in range(0, len(keep), 40):
            chunk = "%0A".join(l.replace("%", "%25").replace("\r", "") for l in keep[start:start + 40])
            print("::error title=build log " + str(start // 40) + "::" + chunk)
        PY
