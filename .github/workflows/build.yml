name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="v${VERSION}"
          JAR="build/libs/stray-${VERSION}.jar"
          if [ ! -f "$JAR" ]; then
            echo "Missing $JAR"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" "$JAR" --title "$VERSION" --generate-notes
          fi
          mkdir -p web/public/mod
          cp "$JAR" "web/public/mod/stray-${VERSION}.jar"
          cp "$JAR" web/public/mod/stray.jar
          printf '{\n    "version": "%s",\n    "minecraft": "26.1.2",\n    "file": "stray-%s.jar"\n}\n' "$VERSION" "$VERSION" > web/public/mod/latest.json
          cp web/public/mod/latest.json web/public/mod.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- web/public/mod/latest.json web/public/mod.json "web/public/mod/stray-${VERSION}.jar" web/public/mod/stray.jar
          if git diff --cached --quiet; then
            echo "Download files are already committed"
            exit 0
          fi
          git commit -m "Publish stray-${VERSION}.jar for the auto-updater."
          git push
      - name: capture build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
