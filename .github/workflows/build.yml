name: build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Publish this commit as the player release
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
    - name: checkout repository
      uses: actions/checkout@v6
    - name: validate gradle wrapper
      uses: gradle/actions/wrapper-validation@v6
    - name: setup jdk
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: make gradle wrapper executable
      run: chmod +x ./gradlew
    - name: build
      if: github.event_name != 'workflow_dispatch' || inputs.release != true
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        SHA: ${{ github.sha }}
      run: |
        if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
          ./gradlew assemble -PstrayChannel=dev -PstraySha="$SHA"
        else
          ./gradlew build
        fi
    - name: publish dev jar
      if: env.HAS_CLOUDFLARE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        SHA: ${{ github.sha }}
        RUN: ${{ github.run_id }}
      run: |
        set -euo pipefail
        VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
        JAR="build/libs/stray-dev-${VERSION}.jar"
        if [ ! -f "$JAR" ]; then
          echo "Missing dev jar $JAR"
          ls -la build/libs || true
          exit 1
        fi
        if ! jar tf "$JAR" | grep -q 'dev/stray/update/AutoUpdate.class'; then
          echo "$JAR is not the compiled mod (AutoUpdate.class missing)"
          exit 1
        fi
        printf '{\n    "version": "%s",\n    "sha": "%s",\n    "run": "%s",\n    "file": "stray-dev.jar"\n}\n' "$VERSION" "$SHA" "$RUN" > dev.json
        # Jar first, then the pointer, so a client never sees a dev.json for a jar that isn't there yet.
        npx --yes wrangler@4 r2 object put "voidmark-capes/mod/dev/stray-dev.jar" --file "$JAR" --content-type application/java-archive --remote
        npx --yes wrangler@4 r2 object put "voidmark-capes/mod/dev/dev.json" --file dev.json --content-type application/json --remote
    - name: build release
      if: github.event_name == 'workflow_dispatch' && inputs.release == true
      run: ./gradlew build
    - name: publish release to R2
      if: github.event_name == 'workflow_dispatch' && inputs.release == true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        set -euo pipefail
        VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
        MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
        JAR="build/libs/stray-${VERSION}.jar"
        if [ ! -f "$JAR" ]; then
          echo "Missing $JAR"
          exit 1
        fi
        printf '{\n    "version": "%s",\n    "minecraft": "%s",\n    "file": "stray-%s.jar"\n}\n' "$VERSION" "$MC" "$VERSION" > latest.json
        npx --yes wrangler@4 r2 object put "voidmark-capes/mod/stray-${VERSION}.jar" --file "$JAR" --content-type application/java-archive --remote
        npx --yes wrangler@4 r2 object put "voidmark-capes/mod/latest.json" --file latest.json --content-type application/json --remote
