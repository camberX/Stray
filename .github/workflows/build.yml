name: build
on:
  pull_request:
  push:
    branches: [multiversion]
  workflow_dispatch:
    inputs:
      release:
        description: Publish this commit as the player release (every Minecraft version)
        type: boolean
        default: false
      legit_only:
        description: With release, publish only Stray Legit (the full release stays as it is)
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
    - name: checkout repository
      uses: actions/checkout@v6
    - name: validate gradle wrapper
      uses: gradle/actions/wrapper-validation@v6
    - name: setup jdk
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: build every Minecraft version
      run: |
        chmod +x ./gradlew
        set -o pipefail
        CHANNEL=release
        if [ "${{ github.event_name }}" = "push" ]; then CHANNEL=dev; fi
        ./gradlew build --continue --stacktrace -PstrayChannel=$CHANNEL -PstraySha=${{ github.sha }} 2>&1 | tee build.log
        # Stray Legit: same sources, no automation / through-walls ESP / loadouts (see legit-exclude.txt).
        ./gradlew build --continue --stacktrace -PstrayChannel=$CHANNEL -PstraySha=${{ github.sha }} -PstrayEdition=legit 2>&1 | tee -a build.log
    - name: collect jars
      if: success()
      run: |
        # One folder per Minecraft version and edition, uploaded below as run artifacts.
        mkdir -p artifacts
        for dir in versions/*/; do
          MC=$(basename "$dir")
          mkdir -p "artifacts/stray-$MC" "artifacts/stray-legit-$MC"
          find "${dir}build/libs" -maxdepth 1 -name 'stray-*.jar' ! -name '*-sources.jar' ! -name 'stray-legit-*' -exec cp {} "artifacts/stray-$MC/" \;
          find "${dir}build/libs" -maxdepth 1 -name 'stray-legit-*.jar' ! -name '*-sources.jar' -exec cp {} "artifacts/stray-legit-$MC/" \;
        done
        ls -R artifacts
    - name: upload Stray 26.3
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: stray-26.3
        path: artifacts/stray-26.3/*.jar
        if-no-files-found: error
    - name: upload Stray 26.2
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: stray-26.2
        path: artifacts/stray-26.2/*.jar
        if-no-files-found: error
    - name: upload Stray Legit 26.3
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: stray-legit-26.3
        path: artifacts/stray-legit-26.3/*.jar
        if-no-files-found: error
    - name: upload Stray Legit 26.2
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: stray-legit-26.2
        path: artifacts/stray-legit-26.2/*.jar
        if-no-files-found: error
    - name: report build errors
      if: failure()
      run: |
        # Surface the compiler and Gradle errors as annotations (readable through the API).
        python3 - <<'PY'
        import re
        lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
        keep = []
        for i, line in enumerate(lines):
            if re.search(r"error:|What went wrong|Exception|FAILED|> ", line):
                keep.extend(lines[i:i + 4])
        keep = [l for n, l in enumerate(keep) if l not in keep[:n]][:400]
        for start in range(0, len(keep), 40):
            chunk = "%0A".join(l.replace("%", "%25").replace("\r", "") for l in keep[start:start + 40])
            print("::error title=build log " + str(start // 40) + "::" + chunk)
        PY
    - name: publish to R2
      if: env.HAS_CLOUDFLARE == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release == true))
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        DEV: ${{ github.event_name == 'push' }}
        SHA: ${{ github.sha }}
        RUN: ${{ github.run_id }}
        LEGIT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.legit_only == true }}
      run: |
        set -euo pipefail
        VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
        put() { npx --yes wrangler@4 r2 object put "voidmark-capes/$1" --file "$2" --content-type "$3" --remote; }
        for dir in versions/*/; do
          MC=$(basename "$dir")
          if [ "$DEV" = "true" ]; then
            JAR=$(ls "$dir"build/libs/stray-dev-mc$MC-*.jar | grep -v -- '-sources' | head -1)
            printf '{\n    "version": "%s",\n    "minecraft": "%s",\n    "sha": "%s",\n    "run": "%s",\n    "file": "stray-dev.jar"\n}\n' "$VERSION" "$MC" "$SHA" "$RUN" > meta.json
            put "mod/$MC/dev/stray-dev.jar" "$JAR" application/java-archive
            put "mod/$MC/dev/dev.json" meta.json application/json
            # Stray Legit dev build: mod/<mc>/legit/dev/
            JAR=$(ls "$dir"build/libs/stray-legit-dev-mc$MC-*.jar | grep -v -- '-sources' | head -1)
            printf '{\n    "version": "%s",\n    "minecraft": "%s",\n    "sha": "%s",\n    "run": "%s",\n    "file": "stray-legit-dev.jar"\n}\n' "$VERSION" "$MC" "$SHA" "$RUN" > meta.json
            put "mod/$MC/legit/dev/stray-dev.jar" "$JAR" application/java-archive
            put "mod/$MC/legit/dev/dev.json" meta.json application/json
          else
            if [ "$LEGIT_ONLY" != "true" ]; then
            JAR=$(ls "$dir"build/libs/stray-mc$MC-*.jar | grep -v -- '-sources' | head -1)
            printf '{\n    "version": "%s",\n    "minecraft": "%s",\n    "file": "stray-%s.jar"\n}\n' "$VERSION" "$MC" "$VERSION" > meta.json
            put "mod/$MC/stray-$VERSION.jar" "$JAR" application/java-archive
            put "mod/$MC/latest.json" meta.json application/json
            fi
            # Stray Legit release: mod/<mc>/legit/
            JAR=$(ls "$dir"build/libs/stray-legit-mc$MC-*.jar | grep -v -- '-sources' | head -1)
            printf '{\n    "version": "%s",\n    "minecraft": "%s",\n    "file": "stray-legit-%s.jar"\n}\n' "$VERSION" "$MC" "$VERSION" > meta.json
            put "mod/$MC/legit/stray-legit-$VERSION.jar" "$JAR" application/java-archive
            put "mod/$MC/legit/latest.json" meta.json application/json
          fi
        done
