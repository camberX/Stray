name: seed-r2
# One-time copy of the last jars that were committed to git into Cloudflare R2,
# so stray.gay and the auto-updater have something to serve before the next release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit that still has web/public/mod in it
        required: true
        default: 6fa350cc
jobs:
  seed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        git show "$REF:web/public/mod/latest.json" > latest.json
        FILE=$(python3 -c 'import json; print(json.load(open("latest.json"))["file"])')
        case "$FILE" in */*|*..*|"") echo "bad file name $FILE"; exit 1;; esac
        git show "$REF:web/public/mod/$FILE" > "$FILE"
        npx --yes wrangler@4 r2 object put "voidmark-capes/mod/$FILE" --file "$FILE" --content-type application/java-archive --remote
        npx --yes wrangler@4 r2 object put "voidmark-capes/mod/latest.json" --file latest.json --content-type application/json --remote
        if git rev-parse -q --verify origin/dev-builds >/dev/null; then
          git show origin/dev-builds:stray-dev.jar > stray-dev.jar
          git show origin/dev-builds:dev.json > dev.json
          npx --yes wrangler@4 r2 object put "voidmark-capes/mod/dev/stray-dev.jar" --file stray-dev.jar --content-type application/java-archive --remote
          npx --yes wrangler@4 r2 object put "voidmark-capes/mod/dev/dev.json" --file dev.json --content-type application/json --remote
        fi
