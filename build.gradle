plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = 'voidmark'
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"voidmark" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Compile against Sodium so world tint can hook the terrain shader.
	// Not bundled; the game loads Sodium from the user's mods folder.
	clientCompileOnly "maven.modrinth:sodium:mc26.1.2-0.9.2-alpha.4-fabric"
	clientCompileOnly "org.lwjgl:lwjgl-tinyfd:3.4.1"
	clientCompileOnly "net.java.dev.jna:jna:5.17.0"
	clientCompileOnly "net.java.dev.jna:jna-platform:5.17.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

def webModDir = layout.projectDirectory.dir("web/public/mod")

tasks.register("syncWebMod") {
	group = "build"
	description = "Copy the built jar to the shop download path and write latest.json."
	dependsOn "assemble"
	outputs.file(webModDir.file("voidmark.jar"))
	outputs.file(webModDir.file("latest.json"))
	doLast {
		def libs = layout.buildDirectory.dir("libs").get().asFile
		def jarFile = new File(libs, "voidmark-${project.version}.jar")
		if (!jarFile.file) {
			throw new GradleException("Missing ${jarFile}")
		}
		def destDir = webModDir.asFile
		destDir.mkdirs()
		new File(destDir, "voidmark.jar").bytes = jarFile.bytes
		def versionedName = "voidmark-${project.version}.jar"
		destDir.listFiles()?.each { f ->
			if (f.name.endsWith(".jar") && f.name != "voidmark.jar" && f.name != versionedName) {
				f.delete()
			}
		}
		new File(destDir, versionedName).bytes = jarFile.bytes
		def spotifyId = (project.findProperty("spotify_client_id") ?: "").toString().trim()
		def meta = [
			version  : project.version.toString(),
			minecraft: project.minecraft_version.toString(),
			file     : versionedName
		]
		if (spotifyId) {
			meta.spotifyClientId = spotifyId
		}
		def latest = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(meta)) + "\n"
		new File(destDir, "latest.json").text = latest
		new File(destDir.parentFile, "mod.json").text = latest
	}
}

tasks.named("build") {
	finalizedBy "syncWebMod"
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
